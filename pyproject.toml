[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-chatbot"
version = "0.2.0"
description = "Context-grounded question answering over your own documents: LangChain, FAISS, hybrid retrieval, pluggable local or hosted models, FastAPI and a measured abstention path."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Aditya Jain" }]
dependencies = [
  "numpy>=1.26",
  "langchain-core>=1.0",
  "langchain-community>=0.4",
  "langchain-text-splitters>=1.0",
  "faiss-cpu>=1.8",
  "pypdf>=4.2",
  "docx2txt>=0.8",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "pydantic>=2.6",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Local models: the default embedder (MiniLM) and the default generator (Qwen2.5-0.5B-Instruct).
local = ["torch>=2.2", "transformers>=4.45", "sentence-transformers>=3.0"]
# The optional Streamlit chat client.
streamlit = ["streamlit>=1.37", "requests>=2.32"]
dev = ["pytest>=8", "ruff>=0.5", "fpdf2>=2.7", "python-docx>=1.1"]
check = ["playwright>=1.45"]

[project.scripts]
rag-chatbot = "rag_chatbot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: loads a real model (deselected by default)"]
addopts = "-m 'not slow' -q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts", "frontend"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
