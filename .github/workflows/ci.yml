name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (no torch, no model downloads)
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Fast tests (offline, CPU, fake embeddings and generator; includes the README sync check)
        run: pytest
